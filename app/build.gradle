plugins {
    id 'com.android.application'
}

android {
    namespace 'app.wordling'
    compileSdk 36

    androidResources {
        noCompress += ['m4a']
    }

    defaultConfig {
        applicationId 'app.wordling'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}
